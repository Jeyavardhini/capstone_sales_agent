[project]
name = "capstone-sales-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeya Kasinathan", email = "12345678+Jeyavardhini@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]

[project.scripts]
capstone-sales-agent = "capstone_sales_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
